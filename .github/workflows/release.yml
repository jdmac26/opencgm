name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for a manual dry run)"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runner: binaries need the glibc they were
          # built against or newer, and 22.04's 2.35 covers far more systems
          # than ubuntu-latest's.
          - os: ubuntu-22.04
            name: linux-x64
            archive: tar.gz
          - os: windows-latest
            name: windows-x64
            archive: zip

    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with VERSION would publish binaries reporting the
      # wrong version under the tag's name.
      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($version)"
            exit 1
          fi

      # Static MSVC runtime: the Windows archive must run without the Visual
      # C++ Redistributable installed. Ignored on Linux.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DOPENCGM_STATIC_MSVC_RUNTIME=ON

      - name: Build
        run: cmake --build build --config Release

      # Never ship a build whose own tests do not pass.
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # Stage through the install rules rather than copying from the build
      # tree: copying by name missed libopencgm.so (built into lib/, not bin/),
      # so the v1.5.0 Linux archive could not start.
      - name: Stage artifacts
        shell: bash
        run: |
          set -e
          out="opencgm-${{ matrix.name }}"
          cmake --install build --config Release --prefix "$out"
          cp LICENSE NOTICE THIRD-PARTY-NOTICES.md README.md "$out/"
          echo "--- staged ---"
          find "$out" -path "$out/include" -prune -o -type f -print | sort

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar czf opencgm-${{ matrix.name }}.tar.gz opencgm-${{ matrix.name }}

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path opencgm-${{ matrix.name }} -DestinationPath opencgm-${{ matrix.name }}.zip

      # Test what users download: unpack the archive where the build tree
      # cannot leak in, then convert a file and check runtime dependencies.
      - name: Smoke-test the archive
        shell: bash
        run: |
          set -e
          mkdir smoke
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd smoke && 7z x -bso0 "../opencgm-${{ matrix.name }}.zip")
          else
            tar xzf "opencgm-${{ matrix.name }}.tar.gz" -C smoke
          fi
          py="$(command -v python3 || command -v python)"
          "$py" scripts/smoke-test-package.py "smoke/opencgm-${{ matrix.name }}" \
            --expect-version "$(tr -d '[:space:]' < VERSION)"

      - uses: actions/upload-artifact@v4
        with:
          name: opencgm-${{ matrix.name }}
          path: opencgm-${{ matrix.name }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum opencgm-*.tar.gz opencgm-*.zip | tee SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            opencgm-*.tar.gz
            opencgm-*.zip
            SHA256SUMS
          generate_release_notes: true
