name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for a manual dry run)"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            archive: tar.gz
          - os: windows-latest
            name: windows-x64
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      # Never ship a build whose own tests do not pass.
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Stage artifacts
        shell: bash
        run: |
          set -e
          out="opencgm-${{ matrix.name }}"
          mkdir -p "$out"
          # Multi-config generators nest binaries under a config directory.
          for d in build/bin build/bin/Release; do
            [ -d "$d" ] && find "$d" -maxdepth 1 -type f \
              \( -name 'opencgm*' -o -name 'cgm_validate*' \) \
              ! -name '*test*' -exec cp {} "$out/" \; || true
          done
          cp LICENSE NOTICE THIRD-PARTY-NOTICES.md README.md "$out/"
          echo "--- staged ---"
          ls -l "$out"

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar czf opencgm-${{ matrix.name }}.tar.gz opencgm-${{ matrix.name }}

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path opencgm-${{ matrix.name }} -DestinationPath opencgm-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: opencgm-${{ matrix.name }}
          path: opencgm-${{ matrix.name }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum opencgm-*.tar.gz opencgm-*.zip | tee SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            opencgm-*.tar.gz
            opencgm-*.zip
            SHA256SUMS
          generate_release_notes: true
